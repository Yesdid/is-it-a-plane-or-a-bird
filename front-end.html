<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <title>Is It a Plane or a Bird?</title>
    </head>
    <body>
        <h1>Is it a plane? Is it a bird? Neither? Lets find out!</h1>
        <div class ="container">
            <div class="row">
                <div class="col-md-6">
                    <h2>Take a Photo!</h2>
                    <label for="camera-source" class="camera-btn">📸 Open Camera</label>
                    <input type="file" id="camera-source" accept="image/*" capture="environment" style="display: none;">
                </div>
                <div class="col-md-6">
                    <h2>Prediction Result</h2>
                    <div id="result"></div>
                </div>
            </div> 

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                margin: 20px;
            }
            .container {
                display: flex;
                justify-content: space-around;
                margin-top: 20px;
            }
            .col-md-6 {
                width: 45%;
            }
            #result {
                margin-top: 20px;
                font-size: 1.2em;
                color: #333;
                white-space: pre-wrap;
            }
            .camera-btn {
                display: inline-block;
                padding: 12px 24px;
                background-color: #007bff;
                color: white;
                font-size: 16px;
                font-weight: bold;
                border-radius: 5px;
                cursor: pointer;
                text-align: center;
            }
            .camera-btn:hover {
                background-color: #0056b3;
            }
        </style>

        <script>
        const cameraInput = document.getElementById('camera-source');
        const resultContainer = document.getElementById('result');

        function addTextElement(parent, tagName, text) {
            const element = document.createElement(tagName);
            element.textContent = text;
            parent.appendChild(element);
            return element;
        }

        function renderResult(data) {
            resultContainer.replaceChildren();
            addTextElement(resultContainer, 'h3', `Prediction: ${data.birdorplane}`);

            if (data.birdorplane === 'aircraft') {
                const flights = data.nearby_aircraft || [];
                addTextElement(resultContainer, 'h3', `Nearby Aircraft (${flights.length})`);

                flights.forEach((flight) => {
                    const card = document.createElement('div');
                    card.className = 'flight-card';
                    addTextElement(card, 'h4', flight.callsign || 'Unknown callsign');
                    addTextElement(card, 'p', `Latitude: ${flight.latitude ?? 'Unknown'}`);
                    addTextElement(card, 'p', `Longitude: ${flight.longitude ?? 'Unknown'}`);
                    addTextElement(card, 'p', `Altitude: ${flight.altitude_ft ?? flight.altitude ?? 'Unknown'} ft`);
                    addTextElement(card, 'p', `Speed: ${flight.speed_mph ?? flight.speed ?? 'Unknown'} mph`);
                    addTextElement(card, 'p', `Category: ${flight.category ?? 'Unknown'}`);
                    resultContainer.appendChild(card);
                });

                if (flights.length === 0) {
                    addTextElement(resultContainer, 'p', 'No nearby aircraft found.');
                }
            } else if (data.birdorplane === 'bird') {
                const birds = data.bird_predictions || {};
                addTextElement(resultContainer, 'h3', `Bird Predictions (${Object.keys(birds).length})`);
                Object.entries(birds).forEach(([name, confidence]) => {
                    addTextElement(resultContainer, 'p', `${name}: ${Number(confidence).toFixed(1)}%`);
                });
            } else {
                addTextElement(resultContainer, 'p', data.message || 'No bird or aircraft was identified.');
            }
        }

        cameraInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            resultContainer.innerHTML = '<p>Uploading and processing...</p>';

            try {
                const response = await fetch('http://127.0.0.1:5000/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || `Server returned ${response.status}`);
                }
                renderResult(data);

            } catch (error) {
                console.error('Upload error:', error);
                resultContainer.textContent = `Error: ${error.message}`;
            }
        });
    </script>
    </body>
</html>
